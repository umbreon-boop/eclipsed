language = "C"
cpp_compat = true
usize_is_size_t = true
style = "both"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
documentation_style = "c99"
header = """/* Generated by eclipsed-ffi's build script; do not edit. */

#ifndef ECLIPSED_H
#define ECLIPSED_H"""
trailer = "#endif /* ECLIPSED_H */"

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[export]
include = ["EclDialect", "EclTrivia", "EclTypeSpanKind", "EclRecord", "EclDeclKind", "EclNameJoin"]
