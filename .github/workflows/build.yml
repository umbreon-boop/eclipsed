name: Build and Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  CRATE_LIB_NAME: eclipsed_ffi
  PUBLISH_NAME: eclipsed

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: so
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: so
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            ext: so
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            ext: so
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "RUSTFLAGS=-C target-feature=-crt-static" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      - run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lib${CRATE_LIB_NAME}.${{ matrix.ext }} \
            dist/lib${PUBLISH_NAME}-${{ matrix.target }}.${{ matrix.ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  build-android:
    strategy:
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo install cargo-ndk

      - run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$(ls $ANDROID_HOME/ndk | sort -V | tail -1)" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo ndk -t ${{ matrix.target }} build --release

      - run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/lib${CRATE_LIB_NAME}.so \
            dist/lib${PUBLISH_NAME}-${{ matrix.target }}.so

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            eclipsed-ffi/include/eclipsed.h

      - uses: jdx/packslip@v1
        id: packslip
        with:
          artifacts: dist/*
          resources: |
            header=asset:eclipsed-ffi/include/eclipsed.h
          formats: |
            libeclipsed-x86_64-unknown-linux-gnu.so=elf
            libeclipsed-x86_64-unknown-linux-musl.so=elf
            libeclipsed-aarch64-unknown-linux-gnu.so=elf
            libeclipsed-aarch64-unknown-linux-musl.so=elf
            libeclipsed-aarch64-apple-darwin.dylib=macho
            libeclipsed-aarch64-linux-android.so=elf
            libeclipsed-x86_64-linux-android.so=elf